requires-python = ">=3.12"
dependencies = [
    "monolyth-db",
    "anthropic>=1.0",
    "pydantic>=2",
]

[tool.uv.sources]
monolyth-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
