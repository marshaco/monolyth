[project]
name = "monolyth"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/db", "apps/api", "services/ingestion"]

[dependency-groups]
dev = ["pytest>=8", "httpx2"]

[tool.pytest.ini_options]
testpaths = ["packages/db/tests", "apps/api/tests", "services/ingestion/tests"]
pythonpath = ["apps/api"]
